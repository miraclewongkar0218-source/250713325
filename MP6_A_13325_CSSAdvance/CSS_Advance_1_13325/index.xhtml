<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Formulir Pendaftaran Organisasi</title>
    <link rel="stylesheet" type="text/css" href="style.css" />
</head>

<body>
    <div class="container">
        <h1>Formulir Pendaftaran Organisasi</h1>
        <form action="" method="post" enctype="multipart/form-data">
            <table cellspacing="0" cellpadding="0" border="0">
                <tr>
                    <td class="label">
                        <label for="nama"><strong>Nama Lengkap</strong></label>
                    </td>
                    <td>
                        <input type="text" id="nama" name="nama" size="30" placeholder="Masukkan nama lengkap Anda" />
                    </td>
                </tr>
                <tr>
                    <td class="label">
                        <label for="nim"><strong>NIM</strong></label>
                    </td>
                    <td>
                        <input type="text" id="nim" name="nim" size="30" placeholder="Masukkan NIM Anda" />
                    </td>
                </tr>
                <tr>
                    <td class="label">
                        <label for="prodi"><strong>Program Studi</strong></label>
                    </td>
                    <td>
                        <select id="prodi" name="prodi">
                            <option>Informatika</option>
                            <option>Sistem Informasi</option>
                            <option>Teknik Industri</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td class="label">
                        <label for="email"><strong>Alamat Email</strong></label>
                    </td>
                    <td>
                        <input type="text" id="email" name="email" size="30" placeholder="Masukkan alamat email Anda" />
                    </td>
                </tr>
                <tr>
                    <td class="label">
                        <label for="telepon"><strong>Nomor Telepon</strong></label>
                    </td>
                    <td>
                        <input type="text" id="telepon" name="telepon" size="30"
                            placeholder="Masukkan nomor telepon Anda" />
                    </td>
                </tr>
                <tr>
                    <td class="label">
                        <strong>Jenis Kelamin</strong>
                    </td>
                    <td>
                        <input type="radio" id="laki" name="jk" value="Laki-Laki" />
                        <label for="laki">Laki-Laki</label>

                        <input type="radio" id="perempuan" name="jk" value="Perempuan" />
                        <label for="perempuan">Perempuan</label>
                    </td>
                </tr>
                <tr>
                    <td class="label">
                        <label for="semester"><strong>Semester</strong></label>
                    </td>
                    <td>
                        <select id="semester" name="semester">
                            <option>Semester 1</option>
                            <option>Semester 2</option>
                            <option>Semester 3</option>
                            <option>Semester 4</option>
                            <option>Semester 5</option>
                            <option>Semester 6</option>
                            <option>Semester 7</option>
                            <option>Semester 8</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td class="label">
                        <strong>Divisi yang Diminati</strong>
                    </td>
                    <td>
                        <input type="radio" id="acara" name="divisi" value="Acara" />
                        <label for="acara">Acara</label>

                        <input type="radio" id="sdm" name="divisi" value="SDM" />
                        <label for="sdm">SDM</label>

                        <input type="radio" id="humas" name="divisi" value="Humas" />
                        <label for="humas">Humas</label>

                        <input type="radio" id="media" name="divisi" value="Media" />
                        <label for="media">Media</label>
                    </td>
                </tr>
                <tr>
                    <td class="label" style="vertical-align:top;">
                        <strong>Pengalaman</strong>
                    </td>
                    <td>
                        <p><strong>Kegiatan</strong></p>
                        <div class="pilihan">
                            <input type="checkbox" id="kepanitiaan" name="pengalaman" value="Kepanitiaan" />
                            <label for="kepanitiaan">Kepanitiaan</label>

                            <input type="checkbox" id="organisasi" name="pengalaman" value="Organisasi" />
                            <label for="organisasi">Organisasi</label>

                            <input type="checkbox" id="volunteer" name="pengalaman" value="Volunteer" />
                            <label for="volunteer">Volunteer</label>
                        </div>

                        <p><strong>Kemampuan</strong></p>
                        <div class="pilihan">
                            <input type="checkbox" id="publicspeaking" name="kemampuan" value="Public Speaking" />
                            <label for="publicspeaking">Public Speaking</label>

                            <input type="checkbox" id="desain" name="kemampuan" value="Desain" />
                            <label for="desain">Desain</label>

                            <input type="checkbox" id="fotografi" name="kemampuan" value="Fotografi" />
                            <label for="fotografi">Fotografi</label>
                        </div>
                    </td>
                </tr>
                <tr>
                    <td class="label" style="vertical-align:top;">
                        <label for="alasan"><strong>Alasan Bergabung</strong></label>
                    </td>
                    <td>
                        <textarea id="alasan" name="alasan" rows="8" cols="30"
                            placeholder="Alasan ingin bergabung di organisasi ini..."></textarea>
                    </td>
                </tr>
                <tr>
                    <td class="label">
                        <label for="cv"><strong>Upload CV</strong></label>
                    </td>
                    <td>
                        <input type="file" id="cv" name="cv" accept="application/pdf" />
                    </td>
                </tr>
                <tr>
                    <td colspan="2" class="tombol">
                        <input type="submit" name="daftar" value="Daftar" />
                    </td>
                </tr>
            </table>
        </form>
    </div>
</body>

</html>
